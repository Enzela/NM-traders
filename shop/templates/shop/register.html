{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — {{ site.site_name|default:"NM Traders" }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f1eb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .auth-card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
    .auth-card h2 { font-family: 'Playfair Display', serif; font-size: 28px; text-align: center; margin-bottom: 25px; color: #111; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #555; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 14px; background: #c98a3d; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .auth-footer a { color: #111; text-decoration: none; font-weight: 600; }
    .messages { background: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Create an Account</h2>
    
    {% if messages %}
      {% for message in messages %}
        <div class="messages">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn-submit">SIGN UP</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'shop:login' %}">Login</a>
    </div>
  </div>

</body>
</html>
